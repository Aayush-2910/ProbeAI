<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProbeAI — An AI That Doesn't Just Ask. It Probes.</title>

    <link rel="icon" type="image/png" href="/Probe-robo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nova Square for all UI text. Inter is kept for the PROBEAI wordmark
         only (font-logo) — Nova Square ships one weight (400), so it isn't
         asked to carry the tracked-out heading treatment too. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nova+Square&display=swap"
      rel="stylesheet"
    />

    <!--
      No-flash theme boot. Dark is the DEFAULT, so the class must be on <html>
      before the bundle runs — deciding it in a useEffect flashes light.
    -->
    <script>
      try {
        var t = localStorage.getItem('probeai-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
